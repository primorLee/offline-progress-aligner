name: CPU tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python examples/synthetic_demo.py --output demo_inputs
      - run: python -m offline_progress_aligner align --human demo_inputs/human.npz --robot demo_inputs/robot.npz --weights weights/aligner_step008308.safetensors --output demo_output/alignment.json --allow-feature-mismatch
