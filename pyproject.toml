[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-progress-aligner"
version = "0.1.0"
description = "Offline same-progress frame matching and filtering from 512-D interaction tokens"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT (code); pretrained weights have a separate non-commercial license"}
dependencies = ["numpy>=1.24", "torch>=2.4", "safetensors>=0.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
progress-align = "offline_progress_aligner.__main__:main"

[project.urls]
Repository = "https://github.com/primorLee/offline-progress-aligner"

[tool.setuptools.packages.find]
include = ["offline_progress_aligner*"]

[tool.setuptools.package-data]
"offline_progress_aligner.vendor" = ["HOST-MIT.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
